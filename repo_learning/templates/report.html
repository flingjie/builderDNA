<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-evolution-learning · 学习报告</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e6;
    --accent: #0b6bcb;
    --sourced: #1a7f37;
    --inferred: #b8860b;
    --unknown: #6b6b6b;
    --chip-bg: #eceef1;
    --focus: #0b6bcb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --panel: #1e1e22;
      --text: #ececec;
      --muted: #9a9aa2;
      --border: #33333a;
      --accent: #58a6ff;
      --sourced: #3fb950;
      --inferred: #d29922;
      --unknown: #9a9aa2;
      --chip-bg: #2a2a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  header.topbar h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .top-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .tab-btn, .filter-btn {
    font: inherit; font-size: .85rem; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 3px 12px; cursor: pointer;
  }
  .tab-btn { font-weight: 600; }
  .tab-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-btn:focus-visible, .filter-btn:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  main { padding: 16px; max-width: 820px; margin: 0 auto; }
  section.module {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  section.module h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .narrative-title { font-size: 1.35rem; line-height: 1.35; margin: 0 0 8px; font-weight: 700; }
  .scope-line { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
  .q-block { margin: 0 0 18px; }
  .q-label { font-weight: 600; color: var(--accent); margin: 0 0 4px; }
  .q-block p { margin: 0; }
  .q-block .tradeoff { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--border); color: var(--muted); }
  .guess { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0 0 18px; }
  .guess summary { cursor: pointer; font-weight: 600; }
  .guess .answer { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .muted { color: var(--muted); font-size: .9rem; }
  .badge {
    display: inline-block; font-size: .72rem; border-radius: 4px;
    padding: 1px 7px; margin-left: 6px; vertical-align: middle; font-weight: 600;
  }
  .badge.sourced { background: rgba(26,127,55,.15); color: var(--sourced); }
  .badge.inferred { background: rgba(184,134,11,.18); color: var(--inferred); }
  .badge.unknown { background: rgba(107,107,107,.18); color: var(--unknown); }
  .claim { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .claim:last-child { border-bottom: none; }
  .claim .refs { margin-top: 4px; }
  a.ref { color: var(--accent); text-decoration: none; margin-right: 8px; font-size: .85rem; }
  a.ref:hover { text-decoration: underline; }
  .excerpt { color: var(--muted); font-size: .85rem; border-left: 2px solid var(--border); padding-left: 8px; margin: 4px 0; }
  .limitations { color: var(--inferred); font-size: .85rem; }
  details { margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .chip {
    display: inline-block; background: var(--chip-bg); border-radius: 4px;
    padding: 1px 8px; font-size: .78rem; margin: 2px 4px 2px 0;
  }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .cardbox { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0 0 12px; }
  .cardbox .q-block { margin-bottom: 10px; }
  .relation-explicit { color: var(--sourced); font-weight: 600; }
  .relation-possible { color: var(--inferred); font-weight: 600; }
  .relation-unconfirmed { color: var(--unknown); font-weight: 600; }
  textarea.notes {
    width: 100%; min-height: 120px; font: inherit; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .toolbar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  button.ghost {
    font: inherit; font-size: .85rem; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  .storage-note { color: var(--muted); font-size: .78rem; margin-top: 4px; }
  .ev-hidden { display: none !important; }
  @media print {
    header.topbar, .toolbar, .filter-group, textarea.notes { display: none !important; }
    details { display: block !important; }
    details > * { display: block !important; }
    section.module { break-inside: avoid; border: 1px solid #ccc; }
    body { background: #fff; color: #000; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 id="report-title">repo-evolution-learning</h1>
  <div class="top-group" role="group" aria-label="阅读路径">
    <button class="tab-btn" data-tab="design" aria-pressed="true">学设计</button>
    <button class="tab-btn" data-tab="promotion" aria-pressed="false">学传播</button>
  </div>
  <div class="filter-group" role="group" aria-label="事实/推断/未知筛选">
    <span class="muted">筛选:</span>
    <button class="filter-btn" data-filter="sourced" aria-pressed="false">事实</button>
    <button class="filter-btn" data-filter="inferred" aria-pressed="false">推断</button>
    <button class="filter-btn" data-filter="unknown" aria-pressed="false">未知</button>
    <button class="filter-btn" data-filter="all" aria-pressed="true">全部</button>
    <span id="filter-count" class="muted"></span>
  </div>
</header>
<main>
  <section class="module" id="panel-design"></section>
  <section class="module ev-hidden" id="panel-promotion"></section>

  <section class="module" id="module-notes">
    <h2>我的笔记</h2>
    <textarea class="notes" id="notes" placeholder="在这里记录你的判断……"></textarea>
    <div class="toolbar">
      <button class="ghost" id="notes-export">导出笔记</button>
      <button class="ghost" id="notes-clear">清除笔记</button>
    </div>
    <p class="storage-note" id="storage-note"></p>
  </section>
</main>

<script type="application/json" id="report-data">{{ report_data }}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var analysis = data.analysis || {};
  var manifest = data.manifest || {};
  var request = data.request || {};
  var sourcesIndex = data.sources_index || {};
  var episode = analysis.episode || {};
  var narrative = analysis.narrative || {};
  var identity = analysis.repo_identity || {};
  var promotionContents = analysis.promotion_contents || [];
  var feedbackLinks = analysis.feedback_links || [];
  var coverageNotes = analysis.coverage_notes || [];
  var platformStats = analysis.platform_stats || [];

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) { for (var k in attrs) { node.setAttribute(k, attrs[k]); } }
    if (children != null) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
    }
    return node;
  }
  function safeHref(url) {
    if (!url) return null;
    if (/^https?:\/\//i.test(url)) return url;
    return null;
  }
  function evidenceClass(status) { return status || "unknown"; }
  function para(text, cls) { return el("p", cls ? { class: cls } : null, text || ""); }

  function renderSourceRef(ref) {
    var src = sourcesIndex[ref.source_id];
    var href = src ? safeHref(src.url || src.canonical_url) : null;
    var label = ref.source_id;
    if (ref.locator) label += " · " + ref.locator;
    var anchor;
    if (href) {
      anchor = el("a", { class: "ref", href: href, target: "_blank", rel: "noopener noreferrer" }, label);
    } else {
      anchor = el("span", { class: "ref" }, label);
    }
    var container = el("div", { class: "refs" }, [anchor]);
    if (ref.excerpt) container.appendChild(el("div", { class: "excerpt" }, ref.excerpt));
    if (src && src.fetch_status && src.fetch_status !== "full") {
      container.appendChild(el("div", { class: "muted" }, "采集状态: " + src.fetch_status));
    }
    return container;
  }

  function renderClaim(claim) {
    var status = claim.evidence_status || "unknown";
    var div = el("div", { class: "claim", "data-evidence": status });
    div.appendChild(el("span", {}, claim.text || ""));
    div.appendChild(el("span", { class: "badge " + evidenceClass(status) }, status));
    (claim.source_refs || []).forEach(function (r) { div.appendChild(renderSourceRef(r)); });
    (claim.limitations || []).forEach(function (l) {
      div.appendChild(el("div", { class: "limitations" }, "限制: " + l));
    });
    return div;
  }

  // One question block with a label and one or more body paragraphs.
  function qBlock(label, nodes) {
    var d = el("div", { class: "q-block" });
    d.appendChild(el("div", { class: "q-label" }, label));
    (Array.isArray(nodes) ? nodes : [nodes]).forEach(function (n) { d.appendChild(n); });
    return d;
  }

  // ── 学设计 ──
  (function renderDesign() {
    var box = document.getElementById("panel-design");
    document.getElementById("report-title").textContent =
      identity.name ? ("repo-evolution-learning · " + identity.owner + "/" + identity.name) : "repo-evolution-learning";

    box.appendChild(el("h1", { class: "narrative-title" }, narrative.headline || episode.title || ""));

    var scopeParts = ["本次只复盘一个迭代，不是整个项目的发展史"];
    if (episode.id) scopeParts.push("迭代 " + episode.id);
    if (request.entry_url) scopeParts.push("入口 " + request.entry_url);
    box.appendChild(el("p", { class: "scope-line" }, scopeParts.join(" · ")));

    box.appendChild(qBlock("出了什么问题？", para(narrative.problem)));
    box.appendChild(qBlock("根本原因是什么？", para(narrative.root_cause)));

    var changeNodes = [para(narrative.what_changed)];
    if (narrative.tradeoff) changeNodes.push(para("代价：" + narrative.tradeoff, "tradeoff"));
    box.appendChild(qBlock("作者怎么修？", changeNodes));

    box.appendChild(qBlock("效果如何？", para(narrative.evidence)));

    var lessonNodes = [para(narrative.lesson)];
    if (narrative.small_experiment) lessonNodes.push(para("小实验：" + narrative.small_experiment));
    box.appendChild(qBlock("我能学到什么？", lessonNodes));

    if (narrative.guess_question) {
      var g = el("details", { class: "guess" });
      g.appendChild(el("summary", {}, "先猜再看：" + narrative.guess_question));
      g.appendChild(el("div", { class: "answer" }, narrative.guess_answer || ""));
      box.appendChild(g);
    }

    // 展开证据：完整备选 / 决策 / 实现调整 / 验证 / 来源 / 缺失材料
    var ev = el("details");
    ev.appendChild(el("summary", {}, "展开证据（完整方案、测试明细与来源）"));

    if (episode.constraints && episode.constraints.length) {
      ev.appendChild(el("h3", {}, "约束"));
      var ulC = el("ul");
      episode.constraints.forEach(function (c) { ulC.appendChild(el("li", {}, c)); });
      ev.appendChild(ulC);
    }
    if (episode.alternatives && episode.alternatives.length) {
      ev.appendChild(el("h3", {}, "备选方案"));
      episode.alternatives.forEach(function (c) { ev.appendChild(renderClaim(c)); });
    }
    if (episode.decisions && episode.decisions.length) {
      ev.appendChild(el("h3", {}, "决策"));
      var wrap = el("div", { id: "episode-decisions" });
      episode.decisions.forEach(function (c) { wrap.appendChild(renderClaim(c)); });
      ev.appendChild(wrap);
      if (request.mode === "guided") {
        var gate = el("details");
        gate.appendChild(el("summary", {}, "先写下你的判断，再展开作者的决策（学习隐藏，非保密）"));
        var ta = el("textarea", { class: "notes", placeholder: "你认为作者会如何取舍？为什么？" });
        gate.appendChild(ta);
        wrap.setAttribute("hidden", "hidden");
        ta.addEventListener("input", function () {
          if (ta.value.trim().length > 0) wrap.removeAttribute("hidden");
        });
        ev.appendChild(gate);
      }
    }
    if (episode.implementation_changes && episode.implementation_changes.length) {
      ev.appendChild(el("h3", {}, "实现调整"));
      var ul2 = el("ul");
      episode.implementation_changes.forEach(function (c) { ul2.appendChild(el("li", {}, c)); });
      ev.appendChild(ul2);
    }
    if (episode.validation && episode.validation.length) {
      ev.appendChild(el("h3", {}, "验证与结果"));
      episode.validation.forEach(function (c) { ev.appendChild(renderClaim(c)); });
    }
    if (episode.outcome) {
      ev.appendChild(el("p", {}, "结果: " + episode.outcome));
    }
    var srcRefs = (narrative.source_refs || []).concat(episode.source_refs || []);
    if (srcRefs.length) {
      ev.appendChild(el("h3", {}, "来源"));
      srcRefs.forEach(function (r) { ev.appendChild(renderSourceRef(r)); });
    }
    if (coverageNotes.length) {
      ev.appendChild(el("h3", {}, "缺失材料"));
      var ulM = el("ul");
      coverageNotes.forEach(function (n) { ulM.appendChild(el("li", {}, n)); });
      ev.appendChild(ulM);
    }
    box.appendChild(ev);
  })();

  // ── 学传播 ──
  (function renderPromotion() {
    var box = document.getElementById("panel-promotion");
    var featured = promotionContents.filter(function (p) { return p.featured; });
    if (featured.length < 2) featured = promotionContents.slice(0, 2);

    if (!featured.length) {
      box.appendChild(el("p", { class: "empty" }, "没有找到传播内容。"));
      return;
    }

    featured.forEach(function (p) {
      var card = el("div", { class: "cardbox" });
      card.appendChild(el("h3", {}, (p.platform || "other") + " · " + (p.content_type || "content")));
      var src = sourcesIndex[p.source_id];
      if (src) {
        var href = safeHref(src.url || src.canonical_url);
        if (href) card.appendChild(el("a", { class: "ref", href: href, target: "_blank", rel: "noopener noreferrer" }, "原文链接"));
      }
      var introNodes = [para((p.audience ? "读者：" + p.audience : ""))];
      if (p.hook) introNodes.push(para("开场：" + p.hook));
      if (p.promise) introNodes.push(para("承诺：" + p.promise));
      card.appendChild(qBlock("别人怎样介绍它？", introNodes));
      card.appendChild(qBlock("用了什么证据？", para(p.proof || "未提供证据")));
      card.appendChild(qBlock("哪些表达值得借用？", para(p.borrowable || "未标注可借鉴表达")));
      box.appendChild(card);
    });

    var ev = el("details");
    ev.appendChild(el("summary", {}, "展开证据（全部传播内容与反馈关联）"));

    if (platformStats.length) {
      var table = el("table");
      var thead = el("thead");
      thead.appendChild(el("tr", {}, [el("th", {}, "平台"), el("th", {}, "数量")]));
      table.appendChild(thead);
      var tbody = el("tbody");
      platformStats.forEach(function (s) {
        tbody.appendChild(el("tr", {}, [
          el("td", {}, s.platform || s.label || ""),
          el("td", {}, String(s.count != null ? s.count : ""))
        ]));
      });
      table.appendChild(tbody);
      ev.appendChild(el("h3", {}, "平台分布"));
      ev.appendChild(table);
    }

    if (promotionContents.length) {
      ev.appendChild(el("h3", {}, "全部传播内容"));
      var list = el("div");
      promotionContents.forEach(function (p) {
        var item = el("details", { class: "cardbox" });
        item.appendChild(el("summary", {}, (p.platform || "other") + " · " + (p.content_type || "content")));
        var body = el("div");
        var src = sourcesIndex[p.source_id];
        if (src) {
          var href = safeHref(src.url || src.canonical_url);
          if (href) body.appendChild(el("a", { class: "ref", href: href, target: "_blank", rel: "noopener noreferrer" }, "原文链接"));
        }
        var fields = [["目标读者", p.audience], ["开场", p.hook], ["承诺", p.promise],
          ["证据", p.proof], ["可借鉴", p.borrowable], ["行动要求", p.call_to_action]];
        fields.forEach(function (f) {
          if (f[1]) body.appendChild(el("p", {}, f[0] + ": " + f[1]));
        });
        body.appendChild(el("p", { class: "muted" },
          "作者类型: " + (p.actor_type || "unknown") + " · 身份匹配: " + (p.repo_match || "confirmed")));
        item.appendChild(body);
        list.appendChild(item);
      });
      ev.appendChild(list);
    }

    if (feedbackLinks.length) {
      ev.appendChild(el("h3", {}, "反馈 ↔ 开发关联"));
      feedbackLinks.forEach(function (l) {
        var d = el("details");
        d.appendChild(el("summary", { class: "relation-" + (l.relation || "unconfirmed") },
          (l.relation || "unconfirmed") + " · " + (l.rationale || "")));
        var body = el("div");
        body.appendChild(el("p", {}, "反馈来源:"));
        (l.feedback_refs || []).forEach(function (r) { body.appendChild(renderSourceRef(r)); });
        body.appendChild(el("p", {}, "开发来源:"));
        (l.development_refs || []).forEach(function (r) { body.appendChild(renderSourceRef(r)); });
        d.appendChild(body);
        ev.appendChild(d);
      });
    }
    box.appendChild(ev);
  })();

  // ── Tab switching ──
  (function initTabs() {
    var designPanel = document.getElementById("panel-design");
    var promoPanel = document.getElementById("panel-promotion");
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
    tabs.forEach(function (b) {
      b.addEventListener("click", function () {
        var tab = b.getAttribute("data-tab");
        tabs.forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        designPanel.classList.toggle("ev-hidden", tab !== "design");
        promoPanel.classList.toggle("ev-hidden", tab !== "promotion");
      });
    });
  })();

  // ── Global evidence filter ──
  (function initFilter() {
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
    var count = document.getElementById("filter-count");
    function apply() {
      var active = null;
      buttons.forEach(function (b) { if (b.getAttribute("aria-pressed") === "true") active = b.getAttribute("data-filter"); });
      var items = Array.prototype.slice.call(document.querySelectorAll("[data-evidence]"));
      var visible = 0;
      items.forEach(function (it) {
        var show = active === "all" || it.getAttribute("data-evidence") === active;
        it.classList.toggle("ev-hidden", !show);
        if (show) visible++;
      });
      count.textContent = visible + "/" + items.length + " 项";
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () {
        buttons.forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        apply();
      });
    });
    apply();
  })();

  // ── Notes (session-only, optional localStorage) ──
  (function initNotes() {
    var ta = document.getElementById("notes");
    var note = document.getElementById("storage-note");
    var KEY = "repo-evolution-learning:notes:" + (manifest.run_id || "run");
    var canStore = true;
    try {
      var stored = localStorage.getItem(KEY);
      if (stored != null) ta.value = stored;
    } catch (e) { canStore = false; }
    note.textContent = canStore
      ? "笔记保存在本浏览器的 localStorage（键 " + KEY + "），仅本设备本浏览器可见。"
      : "浏览器禁用了本地存储；笔记只保留在本页面会话中，刷新后丢失。";
    ta.addEventListener("input", function () {
      if (canStore) { try { localStorage.setItem(KEY, ta.value); } catch (e) {} }
    });
    document.getElementById("notes-export").addEventListener("click", function () {
      var blob = new Blob([ta.value], { type: "text/plain;charset=utf-8" });
      var a = el("a", { href: URL.createObjectURL(blob), download: "notes.txt" });
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    document.getElementById("notes-clear").addEventListener("click", function () {
      ta.value = "";
      if (canStore) { try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  })();
})();
</script>
</body>
</html>
