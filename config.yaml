accounts:
  - hwchase17

github:
  token: ${GITHUB_TOKEN}
  cache_dir: snapshots/cache
  max_concurrent: 5
  rate_limit_margin: 50

embedding:
  model: bge-m3:latest
  base_url: ${EMBEDDING_BASE_URL:-http://localhost:11434/v1}

domains:
  agent:
    topics:
      - mcp
      - langchain
      - agent-framework
      - llm
      - rag
      - tool-calling
      - multi-agent
  devtools:
    topics:
      - sdk
      - cli
      - framework
      - library
      - api
      - open-source-tools
      - developer-tools
  consumer:
    topics:
      - productivity
      - creator-tool
      - no-code
      - automation
      - personal-ai
  infrastructure:
    topics:
      - database
      - networking
      - runtime
      - compiler
      - orchestration
      - observability

vendors:
  domestic:
    - deepseek-ai
    - QwenLM
    - THUDM
    - MoonshotAI
  overseas:
    - anthropics
    - langchain-ai
    - browser-use
    - crewAIInc
    - modelcontextprotocol

output:
  dir: ./output
  formats:
    - markdown
    - json
