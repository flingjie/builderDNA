  - openai
  - trycua
  - letta-ai
  - agntcy

github:
  token: ${GITHUB_TOKEN}
  cache_dir: snapshots/cache
  max_concurrent: 5
  rate_limit_margin: 50

embedding:
  model: nomic-embed-text:latest
  base_url: ${EMBEDDING_BASE_URL:-http://localhost:11434/v1}

domains:
  agent-os:
    topics:
      - agent-harness
      - agent-runtime
      - sandbox
  agent:
    topics:
      - mcp
      - langchain
      - agent-framework
      - tool-calling
      - multi-agent
      - agent-harness
      - ai-agent
      - llm-agent
  devtools:
    topics:
      - sdk
      - cli
      - framework
      - library
      - api
      - open-source-tools
      - developer-tools
  consumer:
    topics:
      - productivity
      - creator-tool
      - no-code
      - automation
      - personal-ai
  infrastructure:
    topics:
      - database
      - networking
      - runtime
      - compiler
      - orchestration
      - observability
  bio-med-ai:
    topics:
      - bioinformatics
      - genomics
      - protein-structure
      - drug-discovery
      - medical-imaging
      - clinical-ai
      - synthetic-biology
      - digital-health
      - computational-biology
      - ai-healthcare
  pi:
    topics:
      - pi-agent
      - decentralized-agent
      - autonomous-agent
      - web3-agent
      - crypto-agent
      - blockchain-agent
      - agent-network
      - parallel-infinity
      - pi-network
      - pi-protocol
      - pi-token
      - pi-consensus
      - pi-blockchain
      - pi-ecosystem

vendors:
  domestic:
    - deepseek-ai
    - QwenLM
    - THUDM
    - MoonshotAI
  overseas:
    - anthropics
    - langchain-ai
    - browser-use
    - crewAIInc
    - modelcontextprotocol

output:
  dir: ./output
  formats:
    - markdown
    - json

observability:
  mismatch_threshold: 7       # events before auto-suggest mismatch check
  expiry_days: 30              # days after last update before pruning
  min_comparison_age_days: 90  # days before a prediction snapshot is eligible for validation
  predictions_dir: predictions # directory for prediction snapshots

opportunity:
  weights:
    velocity: 0.4              # demand weight for trend velocity
    severity: 0.4              # demand weight for pain severity
    frequency: 0.2             # demand weight for pain frequency
  gap_threshold_high: 1.5      # gap > this → Build or Niche
  market_size_threshold: 5.0   # market > this → Build or Monitor
