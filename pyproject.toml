[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "builderdna"
version = "0.1.0"
description = "Analyze GitHub builders, extract tech DNA, and discover opportunities"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "duckdb>=1.0",
    "hdbscan>=0.8",
    "networkx>=3.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.14",
]

[project.scripts]
builderdna = "cli.main:app"

[tool.setuptools.packages.find]
include = ["models*", "collect*", "collector*", "intelligence*", "output*", "signals*", "cli*", "report*"]
exclude = ["snapshots*", "tests*", "output/*.md", "output/*.json"]

[tool.setuptools]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
